spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: ebank-service
          uri: lb://EBANK-SERVICE
          predicates:
            - Path=/EBANK-SERVICE/**
          filters:
            - StripPrefix=1
        - id: customer-ms
          uri: lb://CUSTOMER-MS
          predicates:
            - Path=/CUSTOMER-MS/**
          filters:
            - StripPrefix=1
        - id: ebank-boot
          uri: lb://EBANK-BOOT
          predicates:
            - Path=/EBANK-BOOT/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
