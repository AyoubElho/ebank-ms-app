spring.application.name=ebank-boot
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b
server.port=8090
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8087/mcp
spring.ai.mcp.client.streamable-http.connections.bankAccount.url=http://localhost:8081/mcp
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
eureka.client.jersey.enabled=false